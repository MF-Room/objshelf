[package]
name = "tiermem"
version = "0.1.0"
edition = "2024"
description = "Software-managed object memory for embedded Rust, with typed access, transparent residency, and pluggable storage backends."

[dependencies]
crc = "3.4.0"
embassy-futures = "0.1.2"
embedded-storage = "0.3.2"
embedded-storage-async = "0.4.2"
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rtic-core = "1.0.0"
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
