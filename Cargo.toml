[package]
name = "tiermem"
version = "0.1.0"
edition = "2024"
description = "Software-managed object memory for embedded Rust, with typed access, transparent residency, and pluggable storage backends."

[dependencies]
embedded-storage-async = "0.4.2"
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
