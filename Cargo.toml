[package]
name = "objshelf"
version = "0.1.0"
edition = "2024"
authors = ["Julien Eudine <julien@eudine.fr>", "Marius Debussche <marius.debussche@gmail.com>"]
description = "A portable object store that caches plain Rust values on the heap, over pluggable backends from bare-metal to hosted systems."
license = "LGPL-2.1-only"
repository = "https://github.com/MF-Room/objshelf"
categories = ["embedded", "no-std", "database-implementations", "caching"]
keywords = ["nor-flash", "storage", "persistence", "wear-leveling", "rtic"]

[dependencies]
crc = "3.4.0"
embedded-storage = "0.3.2"
get-size2 = { version = "0.11.1", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rtic-core = "1.0.0"
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", default-features = false, optional = true }

[features]
# File system backend (`backend::fs`), for Unix: needs `std`.
fs = ["dep:libc"]

[dev-dependencies]
get-size2 = { version = "0.11.1", default-features = false, features = ["alloc", "derive"] }

# docs.rs builds with the default features only: this adds the file system backend.
[package.metadata.docs.rs]
features = ["fs"]

[[example]]
name = "std_fs"
required-features = ["fs"]
