[package]
name = "objshelf"
version = "0.1.0"
edition = "2024"
description = "A portable object store that caches plain Rust values on the heap, over pluggable backends from bare-metal to hosted systems."

[dependencies]
crc = "3.4.0"
embedded-storage = "0.3.2"
get-size2 = { version = "0.11.1", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rtic-core = "1.0.0"
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
get-size2 = { version = "0.11.1", default-features = false, features = ["alloc", "derive"] }
